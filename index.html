<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080d18">
<meta name="description" content="NEXTOOLS: tools online gratis untuk gaming dan produktivitas.">
<title>NEXTOOLS — Digital Toolbox</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080d18;color:#e8f1ff;font-family:system-ui,Arial,sans-serif}header{padding:20px 18px;border-bottom:1px solid #202b40;background:#080d18;position:sticky;top:0;z-index:5}.wrap{max-width:850px;margin:auto}.logo{font-size:25px;font-weight:900;letter-spacing:2px}.logo span,.accent{color:#67e8f9}.tag{font-size:12px;color:#8294af;margin-top:4px}.hero{padding:32px 18px 22px}.pill{display:inline-block;color:#67e8f9;border:1px solid #234758;border-radius:30px;padding:6px 11px;font-size:12px}.hero h1{font-size:clamp(30px,8vw,48px);line-height:1.12;margin:18px 0 10px}.muted{color:#91a2bc;line-height:1.6}.search,.field{width:100%;padding:14px;background:#080f1e;color:#f1f5f9;border:1px solid #293750;border-radius:11px;font-size:16px;outline:none}.search{background:#111a2b;margin-top:18px;min-height:52px}.search:focus,.field:focus{border-color:#67e8f9}.section{padding:10px 18px 28px}.section h2{font-size:19px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:#10192a;border:1px solid #25344c;border-radius:16px;padding:17px 13px;cursor:pointer;color:#edf5ff;text-align:left;min-width:0}.card:hover{border-color:#67e8f9}.emoji{font-size:26px}.card h3{font-size:14px;margin:12px 0 5px}.card p{font-size:12px;color:#91a2bc;margin:0;line-height:1.5}.panel{margin:0 18px 26px;background:#10192a;border:1px solid #293750;border-radius:16px;padding:18px;scroll-margin-top:90px}.panel h2{font-size:23px;margin:0}.panelhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:18px}.field{display:block;margin:8px 0 15px;min-height:52px}.field[type=date]{color-scheme:dark;min-height:58px;display:block;width:100%;padding:12px;cursor:pointer;touch-action:manipulation;appearance:auto;-webkit-appearance:auto}.btn{border:0;border-radius:10px;background:#67e8f9;color:#06111d;padding:13px 16px;font-weight:800;font-size:15px;cursor:pointer;min-height:46px;touch-action:manipulation}.secondary{background:#1b2940;color:#e8f1ff;border:1px solid #33445e}.result{white-space:pre-wrap;overflow-wrap:anywhere;background:#080f1e;border:1px solid #293750;border-radius:10px;padding:13px;min-height:48px;margin:12px 0;color:#a5f3fc;line-height:1.7}.hidden{display:none}.label{display:block;color:#cbd5e1;font-size:15px}.empty{color:#91a2bc;font-size:13px;grid-column:1/-1}footer{text-align:center;color:#70819a;font-size:12px;padding:28px 15px;border-top:1px solid #202b40}button:focus-visible{outline:2px solid #67e8f9;outline-offset:3px}@media(min-width:600px){.hero{padding-top:45px}.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<header><div class="wrap"><div class="logo">NEX<span>TOOLS</span> ⚡</div><div class="tag">YOUR DIGITAL TOOLBOX · FREE TO USE</div></div></header>
<main class="wrap">
<section class="hero"><div class="pill">✦ DIGITAL TOOLS / BETA</div><h1>Tools for your<br><span class="accent">digital life.</span></h1><p class="muted">Tools praktis, gratis, dan simpel. Pilih alat yang lu butuhkan.</p><input id="search" class="search" placeholder="🔎 Cari tools..." aria-label="Cari tools"></section>
<section class="section"><h2>✦ Explore Tools</h2><div class="cards" id="cards">
<button class="card" data-tool="nick"><div class="emoji">🎮</div><h3>Nickname Generator</h3><p>Bikin nama gaming unik.</p></button>
<button class="card" data-tool="bio"><div class="emoji">👤</div><h3>Bio Generator</h3><p>Buat bio keren siap salin.</p></button>
<button class="card" data-tool="style"><div class="emoji">✨</div><h3>Text Styler</h3><p>Ubah teks jadi gaya Unicode.</p></button>
<button class="card" data-tool="date"><div class="emoji">📅</div><h3>Date Calculator</h3><p>Hitung selisih dua tanggal.</p></button>
</div></section>
<section class="panel hidden" id="panel"><div class="panelhead"><h2 id="panelTitle">Tool</h2><button class="btn secondary" id="close" type="button">Tutup ✕</button></div><div id="toolContent"></div></section>
</main>
<footer><div class="logo" style="font-size:18px">NEX<span>TOOLS</span> ⚡</div><p>Tools gratis untuk kebutuhan digital lu.</p><p>© <span id="year"></span> NEXTOOLS · Made for everyone</p></footer>
<script>
const $=id=>document.getElementById(id);const panel=$('panel'),content=$('toolContent');$('year').textContent=new Date().getFullYear();
const tools={nick:{title:'🎮 Nickname Generator',html:'<label class="label" for="nickName">Nama dasar</label><input class="field" id="nickName" maxlength="24" placeholder="Contoh: Mulyono"><label class="label" for="nickStyle">Gaya nickname</label><select class="field" id="nickStyle"><option value="pro">Pro Gamer</option><option value="dark">Dark</option><option value="symbol">Simbol</option><option value="clean">Minimalis</option></select><button class="btn" id="generate">Generate Nickname</button><div class="result" id="result" aria-live="polite"></div><button class="btn secondary" id="copy">Salin hasil</button>'},bio:{title:'👤 Bio Generator',html:'<label class="label" for="bioName">Nama atau panggilan</label><input class="field" id="bioName" maxlength="30" placeholder="Nama lu"><label class="label" for="bioMood">Tema bio</label><select class="field" id="bioMood"><option value="gamer">Gamer</option><option value="cool">Cool &amp; simple</option><option value="dream">Dream chaser</option></select><button class="btn" id="generate">Buat Bio</button><div class="result" id="result" aria-live="polite"></div><button class="btn secondary" id="copy">Salin hasil</button>'},style:{title:'✨ Text Styler',html:'<label class="label" for="styleInput">Teks yang mau diubah</label><input class="field" id="styleInput" maxlength="100" placeholder="Ketik teks di sini"><label class="label" for="styleChoice">Gaya tulisan</label><select class="field" id="styleChoice"><option value="bold">Bold — 𝗧𝗲𝘅𝘁</option><option value="italic">Italic — 𝘛𝘦𝘹𝘵</option><option value="script">Script — 𝒯𝑒𝓍𝓉</option><option value="mono">Monospace — 𝚃𝚎𝚡𝚝</option></select><button class="btn" id="generate">Ubah Teks</button><div class="result" id="result" aria-live="polite"></div><button class="btn secondary" id="copy">Salin hasil</button><p class="muted" style="font-size:12px">Sebagian karakter khusus mungkin tidak tampil di semua aplikasi.</p>'},date:{title:'📅 Date Calculator',html:'<label class="label" for="start">Tanggal awal</label><input class="field" type="date" id="start" aria-label="Tanggal awal"><label class="label" for="end">Tanggal akhir</label><input class="field" type="date" id="end" aria-label="Tanggal akhir"><button class="btn" id="generate">Hitung Selisih</button><div class="result" id="result" aria-live="polite"></div><p class="muted" style="font-size:12px">Tips: tekan kolom tanggal untuk membuka kalender HP. Kalau tidak muncul, coba ketuk ikon kalender di sebelah kanan.</p>'}};
function openTool(name){const t=tools[name];if(!t)return;$('panelTitle').textContent=t.title;content.innerHTML=t.html;panel.classList.remove('hidden');panel.scrollIntoView({behavior:'smooth',block:'start'});const result=$('result');const input=id=>$(id).value.trim();
if(name==='nick'){$('generate').onclick=()=>{const n=input('nickName');if(!n){result.textContent='Masukkan nama dulu.';return}const styles={pro:['亗 '+n+' 亗','乂'+n+'乂','『'+n+'』','ツ '+n,'么'+n+'么'],dark:['☠ '+n,'𖤐'+n+'𖤐','†'+n+'†','メ'+n,'影 '+n],symbol:['★彡'+n+'彡★','꧁'+n+'꧂','『'+n+'』','乂 '+n+' 乂','♛'+n+'♛'],clean:[n,n+'_',n+'.exe','its'+n,n+'ツ']};result.textContent=styles[$('nickStyle').value].join('\n')}}
if(name==='bio'){$('generate').onclick=()=>{const n=input('bioName')||'Player';const b={gamer:['🎮 '+n+' | Just play.','⚡ Leveling up every day.','🏆 Play hard, stay humble.'],cool:['Less talk, more action.','✦ '+n+' | On my own path.','☁ Calm mind, big dreams.'],dream:['✦ Dream big, start small.','🚀 '+n+' | Work in progress.','🌙 One day at a time.']};result.textContent=b[$('bioMood').value].join('\n')}}
if(name==='style'){$('generate').onclick=()=>{const s=input('styleInput');if(!s){result.textContent='Masukkan teks dulu.';return}const bases={bold:[0x1D5D4,0x1D5EE],italic:[0x1D608,0x1D622],script:[0x1D4D0,0x1D4EA],mono:[0x1D670,0x1D68A]};const base=bases[$('styleChoice').value];result.textContent=Array.from(s).map(c=>{const n=c.codePointAt(0);if(n>=65&&n<=90)return String.fromCodePoint(base[0]+n-65);if(n>=97&&n<=122)return String.fromCodePoint(base[1]+n-97);return c}).join('')}}
if(name==='date'){$('generate').onclick=()=>{const a=$('start').value,b=$('end').value;if(!a||!b){result.textContent='Pilih tanggal awal dan akhir dulu.';return}const days=Math.round(Math.abs(Date.parse(a+'T00:00:00Z')-Date.parse(b+'T00:00:00Z'))/86400000);result.textContent='Selisih: '+days+' hari\nSekitar '+(days/365.2425).toFixed(2)+' tahun';}}
if($('copy'))$('copy').onclick=async()=>{const text=result.textContent;if(!text)return;try{await navigator.clipboard.writeText(text)}catch(e){const ta=document.createElement('textarea');ta.value=text;content.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}$('copy').textContent='Tersalin ✓'};
}
document.querySelectorAll('[data-tool]').forEach(b=>b.addEventListener('click',()=>openTool(b.dataset.tool)));$('close').onclick=()=>panel.classList.add('hidden');$('search').addEventListener('input',e=>{const q=e.target.value.toLowerCase();let shown=0;document.querySelectorAll('.card').forEach(c=>{const match=c.innerText.toLowerCase().includes(q);c.style.display=match?'block':'none';if(match)shown++});let empty=document.querySelector('.empty');if(empty)empty.remove();if(!shown){empty=document.createElement('p');empty.className='empty';empty.textContent='Tools tidak ditemukan. Coba kata kunci lain.';$('cards').appendChild(empty)}});
</script>
</body>
</html>
